function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
let audio=null,soundOn=false;const soundButton=document.getElementById('sound');
function tone(freq=520,d=.11,type='sine',volume=.06){if(!soundOn)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(volume,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d+.02)}catch(e){}}
function notes(arr){arr.forEach((f,i)=>setTimeout(()=>tone(f,.15,'triangle',.065),i*115))}
soundButton.onclick=()=>{soundOn=!soundOn;soundButton.textContent='♫ Sound: '+(soundOn?'On':'Off');tone(720)};
function show(html){playing=false;overlay.classList.remove('hidden');panel.innerHTML=html}
function hide(){overlay.classList.add('hidden');playing=true;last=performance.now()}
function setup(){show(`<div class="eyebrow">✦ AN ADVENTURE CREATED ONLY FOR YOU ✦</div><h1>Ayantika's <span style="color:#b9defc">Birthday Adventure</span> ❄️</h1><img class="intro-portrait" src="${PHOTO}" alt="Ayantika in her blue winter jacket"><p><strong>Emergency from the Birthday Universe:</strong> three pieces of your birthday star have scattered across magical worlds. Only Ayantika can bring them home!</p><p>Explore three worlds, collect <strong>five hearts in each</strong>, dodge the mischievous clouds, and unlock the secret message waiting for you.</p><button class="btn" id="start">Begin my adventure ✨</button><p class="tiny">Arrow keys / A D to move • Space / ↑ to jump • touch controls on mobile</p>`);document.getElementById('start').onclick=()=>{score=0;life=3;level=0;loadLevel();showIntro()}}
function showIntro(){const messages=[`A chilly little courtyard awaits. The hero is dressed for adventure: <strong>blue winter jacket, red sling bag, glasses, and unstoppable main-character energy.</strong> Collect at least five hearts!`,`Follow the beautiful arches into the world of wishes. Every heart is one wish that someone quietly makes for you: joy, courage, laughter, peace and beautiful surprises.`,`It's almost midnight in the birthday universe. Bring back five final hearts to light the birthday star and unlock your surprise!`];show(`<div class="eyebrow">CHAPTER ${level+1} OF 3 ✦</div><h1>${palettes[level].emoji} ${palettes[level].title}</h1><p>${messages[level]}</p><p class="tiny">Reach the glowing doorway when you've collected five hearts. Avoid the grumpy clouds!</p><button class="btn" id="go">Enter this world →</button>`);document.getElementById('go').onclick=hide}
function loadLevel(){const oldScore=score;player={x:90,y:groundY-77,w:39,h:77,vx:0,vy:0,ground:true,inv:0};camera=0;levelHearts=0;collected=new Set();particles=[];score=oldScore}
function finishLevel(){notes([550,660,880,990]);if(level<2){const txt=level===0?`<strong>First star restored!</strong> Your frosty courtyard quest is complete. The glasses stayed on, the red bag survived, and yes, Ayantika is officially the protagonist.`:`<strong>Second star restored!</strong> The Archway of Wishes has granted you five secret wishes: good surprises, gentle days, brave choices, loud laughter and wonderful people.`;show(`<div class="eyebrow">CHAPTER CLEARED ✦</div><div class="heartline">❄️ 💙 ✨</div><h2>${safe(name)}, you did it!</h2><p>${txt}</p><button class="btn" id="next">Continue to Chapter ${level+2} ➜</button>`);document.getElementById('next').onclick=()=>{level++;loadLevel();showIntro()}}else finishGame()}
function finishGame(){gameOver=true;notes([523,659,784,1047,988,1047]);show(`<div class="eyebrow">✦ ALL THREE STARS RESTORED ✦</div><h1>HAPPY BIRTHDAY,<br>${safe(name).toUpperCase()}! 🎂</h1><img class="ending-portrait" src="${PHOTO}" alt="Ayantika's photograph"><p><strong>Achievement unlocked:</strong> You are the birthday universe's favourite person today. 💙</p><div class="message"><strong>Dear Ayantika,</strong><br><br>I could have sent you a normal birthday message. But you're not a copy-paste kind of person, so I made you a tiny universe instead.<br><br>There's a little bit of you in the whole thing: the winter jacket, your iconic glasses, the red bag, and that quiet main-character energy. And behind every silly heart and every glowing door is the same simple wish — that your next year is full of moments that make you genuinely happy.<br><br>May you find adventures worth remembering, people who make ordinary days special, and reasons to smile even on the difficult days. Here's to more laughter, more chaos, and more good stories.<br><br>Happy birthday, Ayantika. You're one of a kind. ❄️💙<br><br>Made with love (and an unreasonable amount of code),<br><strong>Ritu</strong></div><p class="tiny">${score} hearts • 3 stars restored • 1 legendary birthday girl ✨</p><button class="btn secondary" id="again">Play again ↻</button>`);document.getElementById('again').onclick=()=>{gameOver=false;setup()};rainConfetti()}
function fail(){life--;tone(180,.3,'sawtooth');player.x=Math.max(70,player.x-115);player.y=groundY-player.h;player.vy=0;player.inv=75;if(life<=0){life=3;player.x=90;levelHearts=0;collected=new Set();show(`<h2>Oops! The birthday gremlins got you 👾</h2><p>Even legends need a second try. You've still got this!</p><button class="btn" id="retry">Try again 💗</button>`);document.getElementById('retry').onclick=()=>{loadLevel();hide()}}}
function heart(x,y,s=1,color='#8ccff9'){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle='#5c275c';ctx.beginPath();ctx.moveTo(0,16);ctx.bezierCurveTo(-23,-1,-17,-15,-7,-14);ctx.bezierCurveTo(0,-14,0,-7,0,-7);ctx.bezierCurveTo(3,-17,19,-17,18,-5);ctx.bezierCurveTo(17,3,3,14,0,16);ctx.fill();ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(0,12);ctx.bezierCurveTo(-20,-3,-15,-12,-6,-11);ctx.bezierCurveTo(0,-11,0,-5,0,-5);ctx.bezierCurveTo(3,-14,16,-13,15,-4);ctx.bezierCurveTo(14,3,3,10,0,12);ctx.fill();ctx.restore()}
function star(x,y,r=8,c='#fff1b5'){ctx.fillStyle=c;ctx.beginPath();for(let j=0;j<8;j++){let a=j*Math.PI/4-Math.PI/2,rr=j%2?r*.42:r;ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}ctx.closePath();ctx.fill()}
function round(x,y,w,h,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h)}
function text(t,x,y,size=18,c='#fff',font='700'){ctx.font=`${font} ${size}px 'DM Sans',sans-serif`;ctx.textAlign='left';ctx.fillStyle='#24152c';ctx.fillText(t,x+2,y+2);ctx.fillStyle=c;ctx.fillText(t,x,y)}
// Distinctive cartoon hero inspired by the uploaded photo: glasses, pulled-back dark hair, white shirt,
// teal pinafore with black hearts, pink crossbody purse.
function drawHero(x,y,t){ctx.save();ctx.translate(Math.round(x),Math.round(y));if(player.inv>0&&Math.floor(player.inv/5)%2===0)ctx.globalAlpha=.5;const walk=Math.abs(player.vx)>1?Math.sin(t*.025)*5:0;
// wind-swept dark bob and winter scarf
round(7,3,38,45,13,'#282334');round(3,16,14,33,7,'#302b3a');round(35,18,12,31,6,'#302b3a');
// olive trousers and boots
rect(11,59+walk,12,17,'#686044');rect(27,59-walk,12,17,'#686044');round(7,72+walk,18,7,3,'#272c40');round(26,72-walk,17,7,3,'#272c40');
// royal blue puffer jacket with sleeves
round(0,38,15,34,7,'#2b629c');round(37,38,15,34,7,'#286198');round(9,32,33,39,6,'#347bb8');for(let a=41;a<65;a+=8)rect(11,a,28,2,'#22588c');rect(24,37,2,32,'#aacfe4');
// little red crossbody bag and strap
ctx.strokeStyle='#d46b73';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(16,34);ctx.lineTo(31,64);ctx.stroke();round(26,54,17,18,5,'#ba445c');round(27,57,15,4,2,'#db6884');
// face and wavy bangs
round(14,8,27,27,11,'#dcaa8f');round(10,4,34,11,7,'#242331');round(11,7,10,13,5,'#2d2838');round(35,8,10,14,5,'#2d2838');
// oversized black-rimmed glasses
ctx.strokeStyle='#27273b';ctx.lineWidth=2.3;ctx.strokeRect(15,17,12,8);ctx.strokeRect(29,17,12,8);ctx.beginPath();ctx.moveTo(27,20);ctx.lineTo(29,20);ctx.stroke();rect(20,21,2,2,'#352733');rect(34,21,2,2,'#352733');ctx.strokeStyle='#9b5c60';ctx.lineWidth=1;ctx.beginPath();ctx.arc(29,28,4,.2,Math.PI-.2);ctx.stroke();
// black scarf
round(10,33,33,8,4,'#1b2538');round(27,37,8,13,3,'#232b3e');ctx.restore()}
function background(t){let p=palettes[level],grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,p.sky);grad.addColorStop(1,p.sky2);ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
for(let i=0;i<70;i++){let sx=(i*139+38-camera*.09%(W+60)+W*5)%(W+60),sy=(i*59+27)%380;star(sx,sy,1.5+i%3,i%4?'#cde8ff':'#fff2c3')}
if(level===0){for(let i=0;i<10;i++){let x=(i*190-camera*.22%(W+300)+W*6)%(W+300)-100;rect(x,257,96,209,'#466b8d');round(x-9,243,115,18,6,'#c0e8fc');round(x+18,283,62,105,29,'#1d3d63');rect(x+29,325,40,63,'#244969');star(x+48,292,5,'#fff1b4')}}
if(level===1){for(let i=0;i<8;i++){let x=(i*230-camera*.26%(W+300)+W*6)%(W+300)-80;rect(x,222,132,246,'#8a7c9f');round(x-8,205,146,22,8,'#e3c8d5');round(x+24,258,85,199,40,'#524b76');round(x+35,265,63,190,28,'#645a87');star(x+65,285,6,'#ffe6a0')}}
if(level===2){for(let i=0;i<6;i++){let x=(i*280+90-camera*.13+W*5)%(W+250)-80,y=95+i%3*52;ctx.fillStyle=i%2?'#b0a8eb':'#f4bcdf';ctx.beginPath();ctx.arc(x,y,25+i%3*10,0,Math.PI*2);ctx.fill();star(x+8,y-11,11,'#fff5c9')}}
rect(0,groundY,W,H-groundY,p.floor);rect(0,groundY,W,10,p.grass);for(let i=0;i<30;i++){let x=(i*81-camera*.65%W+W*4)%W,y=480+(i*29)%57;rect(x,y,9,5,'#ffffff18')}}
function scenery(t){const l=levels[level],p=palettes[level];for(let i=0;i<l.blocks.length;i++){let b=l.blocks[i],x=b.x-camera;round(x,b.y,b.w,16,5,p.floor);rect(x,b.y,b.w,6,p.grass);for(let j=0;j<b.w;j+=33)rect(x+j,b.y+10,12,5,'#ffffff18')}
for(let i=0;i<l.hearts.length;i++){if(collected.has(i))continue;let wx=l.hearts[i],x=wx-camera;if(x<-30||x>W+30)continue;let y=groundY-60-Math.sin(t*.004+i)*5;heart(x,y,.8);star(x+16,y-20,3,'#fff5b2')}
for(let i=0;i<l.hazards.length;i++){let x=l.hazards[i]-camera;if(x<-50||x>W+50)continue;let y=groundY-30;round(x-21,y,43,29,14,level===1?'#a77190':'#5f4c8b');round(x-16,y-7,32,15,10,level===1?'#c99ba9':'#8d73b1');rect(x-8,y+7,4,5,'#f5f5ff');rect(x+7,y+7,4,5,'#f5f5ff');rect(x-1,y+17,5,3,'#3c2e52')}
let gateX=l.gate-camera;round(gateX-8,groundY-125,78,125,27,'#efabd6');round(gateX,groundY-116,62,116,22,'#754c96');round(gateX+8,groundY-107,46,108,19,level===2?'#f6b8d1':'#a77cc1');for(let j=0;j<4;j++)star(gateX+30+Math.cos(t*.002+j*1.5)*38,groundY-65+Math.sin(t*.002+j*1.5)*60,5,'#fff3bb');heart(gateX+29,groundY-70,1.2,'#90c9f9');}
function hud(){round(18,16,370,53,13,'#1a1236bc');text(`WORLD ${level+1}/3  ${palettes[level].emoji}`,31,40,16,'#fff2cf');heart(210,37,.63);text(`${levelHearts}/5`,226,41,15,'#fff3c9');text('♥ '+life,316,41,17,'#ffbbd5');round(W-269,17,248,44,12,'#1a1236bc');text('💗  TOTAL '+score,W-246,46,18,'#fff2e6');if(player.x>2130&&levelHearts<5){round(W/2-180,80,360,40,12,'#311d47e6');text(`Find ${5-levelHearts} more hearts to unlock!`,W/2-165,107,16,'#ffe6b6')}}
function spawn(x,y,col){for(let i=0;i<11;i++)particles.push({x,y,vx:(Math.random()-.5)*6,vy:(Math.random()-.5)*6,ttl:26,c:col})}
function update(dt){if(!playing||paused)return;elapsed+=dt;let p=player;let oldY=p.y,move=keys.right?1:keys.left?-1:0;p.vx=move*4.5;if(keys.jump&&p.ground){p.vy=-13.5;p.ground=false;tone(380,.07,'triangle',.035)}p.vy=Math.min(p.vy+.62,14);p.x=Math.max(8,Math.min(levels[level].gate+10,p.x+p.vx));p.y+=p.vy;p.ground=false;if(p.y+p.h>=groundY){p.y=groundY-p.h;p.vy=0;p.ground=true}for(let b of levels[level].blocks){if(p.vy>=0&&oldY+p.h<=b.y+7&&p.y+p.h>=b.y&&p.x+p.w>b.x&&p.x<b.x+b.w){p.y=b.y-p.h;p.vy=0;p.ground=true}}
if(p.inv>0)p.inv-=dt;camera=Math.max(0,Math.min(WORLD-W,p.x-W*.32));levels[level].hearts.forEach((x,i)=>{if(collected.has(i))return;let y=groundY-60-Math.sin(elapsed*.004+i)*5;if(Math.abs(p.x+p.w*.5-x)<36&&Math.abs(p.y+p.h*.5-y)<53){collected.add(i);score++;levelHearts++;spawn(x,y,'#ffc0dc');tone(690+levelHearts*80,.12,'sine',.075)}});
if(p.inv<=0)for(let x of levels[level].hazards){if(p.x+p.w>x-21&&p.x<x+22&&p.y+p.h>groundY-30){fail();break}}
if(p.x>=levels[level].gate-14){if(levelHearts>=5){p.x=levels[level].gate-18;finishLevel()}else{p.x=levels[level].gate-70;p.vx=0}}particles.forEach(z=>{z.x+=z.vx*dt;z.y+=z.vy*dt;z.vy+=.13*dt;z.ttl-=dt});particles=particles.filter(z=>z.ttl>0)}
function draw(t){background(t);scenery(t);drawHero(player.x-camera,player.y,t);for(let z of particles)rect(z.x-camera,z.y,7,7,z.c);hud()}
function loop(ts){let dt=Math.min((ts-last)/16.67||1,2);last=ts;now=ts;update(dt);draw(ts);requestAnimationFrame(loop)}
function down(e,key){e.preventDefault();keys[key]=true}function up(e,key){e.preventDefault();keys[key]=false}
for(let key of ['left','right','jump']){let el=document.getElementById(key);el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);down(e,key)});el.addEventListener('pointerup',e=>up(e,key));el.addEventListener('pointercancel',e=>up(e,key));el.addEventListener('lostpointercapture',e=>keys[key]=false)}
window.addEventListener('keydown',e=>{let k=e.key.toLowerCase();let m={'arrowleft':'left','a':'left','arrowright':'right','d':'right','arrowup':'jump',' ':'jump','w':'jump'}[k];if(m&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();keys[m]=true}});
window.addEventListener('keyup',e=>{let k=e.key.toLowerCase();let m={'arrowleft':'left','a':'left','arrowright':'right','d':'right','arrowup':'jump',' ':'jump','w':'jump'}[k];if(m)keys[m]=false});window.addEventListener('blur',()=>{keys.left=keys.right=keys.jump=false});
function rainConfetti(){let o=overlay;for(let i=0;i<50;i++){const s=document.createElement('i');s.className='confetti';s.style.left=(Math.random()*100)+'%';s.style.top='-20px';s.style.background=['#ffa7cb','#ffe1a6','#cbb0ff','#a8e9dd'][i%4];s.style.animationDuration=(2+Math.random()*3)+'s';s.style.animationDelay=(Math.random()*4)+'s';o.appendChild(s)}setTimeout(()=>o.querySelectorAll('.confetti').forEach(e=>e.remove()),9000)}
setup();requestAnimationFrame(loop);
})();
</script></body></html>
